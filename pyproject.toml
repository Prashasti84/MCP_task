[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "1.0.0"
description = "Human-in-the-loop approval popups for MCP requests made by Claude Desktop and Claude Web"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[tool.setuptools]
packages = ["mcpguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
